# ==========================================================================
# 科技热 (Tech Heat) - Nginx 生产环境配置
# 静态资源直出 + 动态页面代理到 Node.js SSR
# ==========================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/keji-error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 10240;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/keji-access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;

    keepalive_timeout 65;
    keepalive_requests 100;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    client_max_body_size 10m;

    # 上游 Node.js SSR 服务（Docker 内部通过服务名 ssr 通信）
    upstream keji_backend {
        server ssr:4321;
        keepalive 32;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name keji.re www.keji.re localhost;

        # 安全头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── 静态资源：Nginx 直接返回，不经过 Node.js ──
        location /assets/ {
            root /var/www/keji/dist/client;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location /scripts/ {
            root /var/www/keji/dist/client;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location = /favicon.svg {
            root /var/www/keji/dist/client;
            expires 30d;
            access_log off;
        }

        # ── 动态页面：代理到 Node.js SSR ──
        location / {
            # 显式允许常见 HTTP 方法（防止安全模块/CDN 默认拦截 PUT/DELETE/PATCH）
            if ($request_method !~ ^(GET|POST|PUT|DELETE|PATCH|OPTIONS|HEAD)$) {
                return 405;
            }

            # 直接响应 OPTIONS 预检请求，不经过 SSR/后端
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
                add_header 'Access-Control-Max-Age' 1728000 always;
                add_header 'Content-Type' 'text/plain; charset=utf-8' always;
                add_header 'Content-Length' 0 always;
                return 204;
            }

            proxy_pass http://keji_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            # 代理超时
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 禁止访问隐藏文件
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}