# ==========================================================================
# 科技热 - Nginx 站点配置
# SSR 容器名 "ssr"，docker-compose 内部网络直连
# 支持 HTTPS，HTTP 自动跳转
# ==========================================================================

upstream kejir_backend {
    server ssr:4321;
    keepalive 32;
}

# HTTP -> HTTPS 跳转
server {
    listen 80;
    server_name kejir.com www.kejir.com;
    return 301 https://$host$request_uri;
}

# HTTPS 主站点
server {
    listen 443 ssl;
    http2 on;
    server_name kejir.com www.kejir.com;

    # SSL 证书（容器内路径，由 Dockerfile.nginx 构建时复制到 /usr/local/nginx/ssl）
    ssl_certificate     /usr/local/nginx/ssl/kejir.com_bundle.pem;
    ssl_certificate_key /usr/local/nginx/ssl/kejir.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # 文件上传大小限制（文章封面/正文图片上传）
    client_max_body_size 20m;

    # 站点根目录（容器内路径，由 Dockerfile.nginx 构建时复制到 /usr/local/nginx/kejir）
    root /usr/local/nginx/kejir/dist/client;

    # ── 静态资源：Nginx 直接返回 ──
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /scripts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.svg {
        expires 30d;
        access_log off;
    }

    # ── 动态页面：代理到 SSR 容器 ──
    location / {
        # 显式允许常见 HTTP 方法（防止安全模块/CDN 默认拦截 PUT/DELETE/PATCH）
        if ($request_method !~ ^(GET|POST|PUT|DELETE|PATCH|OPTIONS|HEAD)$) {
            return 405;
        }

        # 直接响应 OPTIONS 预检请求，不经过 SSR/后端
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Max-Age' 1728000 always;
            add_header 'Content-Type' 'text/plain; charset=utf-8' always;
            add_header 'Content-Length' 0 always;
            return 204;
        }

        proxy_pass http://kejir_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}